faq:
- q: Does a halal ingredient make a homemade dish certified?
  a: No. The full dish and preparation need consideration, and a product certificate does not automatically certify
    someone’s home kitchen.
- q: Can a potluck include home-cooked dishes?
  a: That depends on the group’s agreed requirements. Ask participants what evidence and preparation information
    they need.
- q: Is a vegetarian dish automatically suitable for every Muslim colleague?
  a: Not necessarily. Ingredient sources, alcohol and preparation can matter; ask rather than assume.
- q: Can I label food nut-free because the recipe has no nuts?
  a: A recipe does not establish the absence of cross-contact. Ask the cook or supplier and follow the diner’s requirements.
- q: How long can food stay at room temperature?
  a: Follow the supplier’s instructions and current SFA guidance. Plan to keep hot and cold foods at suitable temperatures
    and minimise time out of control.
- q: What if someone brings an unlabelled dish?
  a: Ask the contributor for ingredients and preparation information. If the required details cannot be established,
    do not apply a halal or allergen-free label.
