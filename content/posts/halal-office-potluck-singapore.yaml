title: 'Halal office potluck in Singapore: a practical organiser’s checklist'
status: published
dek: Plan an inclusive halal office potluck with certification checks, allergen labels, practical portions and safe
  food handling.
answer: A good office potluck makes it easy for everyone to eat with confidence. Agree on the group’s halal standard,
  collect dietary needs privately, assign dishes and plan safe storage before the invitations turn into a table
  full of food.
author: The Humble Halal Team
datePublished: '2026-10-28'
dateModified: '2026-10-28'
