faq:
- q: Does MUIS certify every imported product?
  a: MUIS says it does not certify food manufactured overseas. It recognises foreign halal certification bodies;
    check the exact issuer and product scope.
- q: Does a recognised foreign certifier mean every product it could certify is halal-certified?
  a: No. Recognition of the body and certification of a specific product or factory are separate checks.
- q: Can different flavours of the same snack have different status?
  a: They can have different ingredients or manufacturing sources. Check the precise flavor and pack.
- q: Does an E-number prove an ingredient is halal or non-halal?
  a: Not by itself. The source and production context can matter; seek product-specific evidence.
- q: What if the retailer cannot identify the issuer?
  a: Record the status as unverified, contact the importer or manufacturer, or choose a product with adequate evidence.
- q: Does halal certification cover allergies?
  a: No. Read the allergen label and contact the manufacturer for an allergy-related question.
