faq:
- q: Is every stall in a hawker centre covered by the same halal certificate?
  a: No. Treat each stall as a separate establishment and verify the relevant operator, premises and scope.
- q: Does Muslim-owned mean MUIS-certified?
  a: Not necessarily. Ownership and certification are separate descriptions. Check the current MUIS record when
    certification is required.
- q: Is a stall without a MUIS certificate automatically non-halal?
  a: No. MUIS states that stalls can sell halal food without a certificate, and operators remain responsible for
    their claims. Ask for the evidence you need.
- q: Is no pork and no lard the same as halal?
  a: It does not establish the status of meat, sauces, alcohol-containing ingredients, equipment or preparation.
    Make a separate check.
- q: Can I trust an old photograph of a certificate?
  a: Use it only as a lead. Verify the business, location, validity and relevant scope through current official
    information.
- q: Is a halal meal automatically allergen-free?
  a: No. Confirm allergens and preparation directly with the stall, especially for a serious allergy.
