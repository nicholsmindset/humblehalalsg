sections:
  - h2: "The quick way to find halal dessert near you"
    body:
      - >-
        A good halal dessert search starts with three questions: how far are you
        willing to travel, what kind of sweet are you actually craving, and how much
        assurance do you need? A family looking for a birthday cake has a different
        problem from friends hunting for waffles after dinner. Search by neighbourhood
        first, then filter by dessert type and halal-confidence level. This avoids the
        familiar situation where a beautiful recommendation is forty minutes away,
        closed on the day you visit, or only has a vague "no pork" statement.
      - >-
        Humble Halal separates MUIS-certified businesses from Muslim-owned and other
        self-described options because those labels are not interchangeable. MUIS
        certification is premises-specific and renewable; Muslim ownership can give
        useful context but is not the same third-party assurance. Open the listing for
        the exact outlet, note when its status was last checked, and confirm it in the
        current MUIS directory before making a special trip. For an immediate option,
        use the map and choose a place that is open now rather than relying on an old
        roundup screenshot.
    bullets:
      - "Choose an area or MRT station before choosing a dessert"
      - "Filter for gelato, waffles, cakes, local sweets or delivery"
      - "Check the exact outlet rather than assuming a whole chain has one status"
      - "Reconfirm hours and certification before a long journey or group order"
    links:
      - label: "Browse halal desserts near you"
        href: "https://www.humblehalal.com/halal-dessert-singapore"
      - label: "Open the Humble Halal map"
        href: "https://www.humblehalal.com/map"
  - h2: "Best halal dessert types for different cravings"
    body:
      - >-
        Gelato and waffles suit a casual catch-up because everyone can order a
        different flavour and share warm sides. Overscoop's official site describes
        the brand as halal-certified and highlights mochi waffles, croffles, gelato and
        lava cake. That combination makes it useful when a group cannot agree between
        something cold, something baked and something chocolatey. Still check the
        current outlet details and allergens: halal certification does not mean a
        product is dairy-free, nut-free or suitable for every dietary restriction.
      - >-
        Bakery counters are better for taking something home. Shinfuni's official site
        describes its Singapore operation as a MUIS halal-certified Taiwanese bakery,
        with cream puffs, apple pies, tarts and viennoiserie plus islandwide delivery
        and pickup. A family café such as Enchanted Café may suit a longer meal because
        its official site pairs halal-certified comfort food with dessert treats. These
        are examples of different formats, not a paid ranking: a focused gelato shop,
        a takeaway bakery and a sit-down café solve different needs.
    bullets:
      - "Gelato and waffles: easy sharing and mix-and-match flavours"
      - "Cakes and pastries: take-home treats, gifting and celebrations"
      - "Local desserts: familiar flavours such as gula melaka, pandan and coconut"
      - "Sit-down cafés: best when dessert is part of a full meal or long catch-up"
    links:
      - label: "Overscoop official site"
        href: "https://www.overscoop.com.sg/"
      - label: "Shinfuni official ordering site"
        href: "https://www.shinfuni.sg/en_SG"
      - label: "Enchanted Café official site"
        href: "https://www.enchantedcafe.co/"
  - h2: "Where to go by area and MRT"
    body:
      - >-
        Central Singapore gives you the widest choice in the smallest radius. Bugis
        and Kampong Glam work well for an after-dinner walk because cafés, bakeries and
        Turkish or Middle Eastern sweets sit within reach of Bugis MRT and Masjid
        Sultan. Orchard is convenient for mall-based chains and cake pickup, while
        City Hall connects Raffles City, Funan, Suntec City and Marina Square. These
        areas are efficient for mixed groups because a dessert stop can follow a meal,
        shopping or prayer without another long ride.
      - >-
        In the east, Tampines, Paya Lebar, Bedok and Pasir Ris offer mall convenience
        alongside independent Muslim-owned cafés. In the north and west, start with
        major transport hubs such as Northpoint City, Causeway Point, Jurong East and
        Clementi, then widen the map radius only if the first results do not match your
        craving. The useful question is not "what is Singapore's single best dessert?"
        but "what is a trustworthy, open option that fits tonight's route?" That is
        why area guides and live maps age better than a fixed top-ten list.
    bullets:
      - "Bugis and Kampong Glam: café hopping, baklava and post-dinner walks"
      - "Orchard and City Hall: mall-based pickup and central meeting points"
      - "Tampines and Paya Lebar: strong east-side choice for families and groups"
      - "Jurong East and Northpoint: practical hubs for west and north residents"
    links:
      - label: "Halal food around Bugis and Arab Street"
        href: "https://www.humblehalal.com/blog/halal-food-bugis-arab-street"
