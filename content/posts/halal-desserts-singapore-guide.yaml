      - label: "Halal food at Funan and Raffles City"
        href: "https://www.humblehalal.com/blog/halal-food-funan-raffles-city"
  - h2: "What to check in mousse, cheesecake, ice cream and pastries"
    body:
      - >-
        Dessert ingredients can be less obvious than a savoury menu. Gelatine may set
        mousse, marshmallow, jelly or cheesecake; its source matters. Some cheesecakes
        use cheese made with animal rennet. Emulsifiers, shortening and flavourings can
        also come from different sources. Alcohol is another common issue in tiramisu,
        rum cake, liqueur chocolates and some extracts. A sign saying "no pork, no
        lard" does not answer every one of those questions.
      - >-
        This is where certification removes work for the diner: the certified scope
        covers the assessed products, ingredients and preparation system. If a shop is
        Muslim-owned rather than certified, ask a narrow, answerable question instead
        of demanding a broad promise. For example: "Does this mousse contain gelatine,
        and what is its source?" or "Is alcohol used in this flavour?" Staff can answer
        specific product questions more reliably than an abstract "is everything
        halal?" If the answer remains unclear, choose a certified alternative.
    bullets:
      - "Gelatine in mousse, jelly, marshmallow and some cheesecake"
      - "Alcohol in tiramisu, rum cake, truffles and flavour extracts"
      - "Animal rennet in some cheeses and dairy desserts"
      - "Shared equipment and changing seasonal flavours"
    links:
      - label: "Check gelatine in the ingredient guide"
        href: "https://www.humblehalal.com/tools/ingredient-checker/gelatin"
      - label: "Learn how to check MUIS certification"
        href: "https://www.humblehalal.com/blog/how-to-check-muis-halal-certification"
      - label: "Search the official MUIS halal directory"
        href: "https://halal.muis.gov.sg/halal/establishments"
  - h2: "Halal dessert for birthdays, dates and family outings"
    body:
      - >-
        For birthdays, decide serving size, delivery window and dietary needs before
        choosing a design. A dramatic cake is not helpful if it arrives after the
        guest of honour or cannot fit in the fridge. Ask how many realistic slices the
        listed size produces, whether candles and a message plaque are included, and
        how long the cake can remain outside refrigeration. Place custom orders early;
        reserve same-day delivery for simple, in-stock cakes.
      - >-
        For a date or a catch-up, ambience and closing time matter more than a large
        menu. Choose one convenient dessert stop after a useful activity or meal, then
        keep a nearby backup. Families may prefer a café with savoury food, high chairs
        and easy parking, while a group of friends might prioritise shareable waffles
        and late hours. Prayer planning is equally practical: around Kampong Glam,
        Masjid Sultan makes a natural anchor; in malls, check the building's current
        prayer-room information rather than assuming one is available.
    bullets:
      - "Birthday: confirm size, refrigeration, delivery window and allergens"
      - "Date: choose atmosphere, easy transport and one backup nearby"
      - "Family: look for seating, savoury options, toilets and straightforward parking"
      - "Group: pick shareable formats and check last-order time"
    links:
      - label: "Halal cakes and bakeries guide"
        href: "https://www.humblehalal.com/blog/halal-cakes-bakeries-singapore"
      - label: "Best halal cafés in Singapore"
        href: "https://www.humblehalal.com/blog/best-halal-cafes-singapore"
  - h2: "Late-night halal dessert without a wasted journey"
    body:
      - >-
        "Open late" is one of the fastest-changing facts in food discovery. Kitchens
        may stop taking dessert orders before the venue closes, and weekend hours can
        differ from weekdays. Check the business's own channel on the day, look for a
        recent update, and phone ahead if you are crossing the island. A listing that
        once stayed open past midnight should not be treated as a permanent promise.
      - >-
        Plan late-night dessert around transport as well as food. A café ten minutes
        from an MRT station can feel much farther after the last train, while a central
        location may have limited parking. Choose a compact area with multiple options,
        save one certified fallback, and check last order rather than just closing
        time. If every suitable shop is shut, an in-stock cake or frozen dessert from
        a certified retailer is a better decision than lowering your halal-confidence
        standard because you are hungry.
    bullets:
      - "Verify today's hours on the business's own page"
      - "Ask for kitchen last order, not only the door-closing time"
      - "Save a second option within the same area"
      - "Plan the ride home before ordering"
  - h2: "How Humble Halal chooses and labels dessert options"
    body:
      - >-
        Humble Halal does not issue halal certification or religious rulings. We record
        the strongest status supported by available evidence, distinguish official
        certification from Muslim ownership and self-description, and include a
        last-checked date where possible. Payment does not determine verification,
        recommendation or rank. If a business sponsors content, that relationship must
        be disclosed separately from the status evidence.
      - >-
        Dessert data changes: certificates expire or renew, outlets close, recipes
        change and limited flavours appear. Treat this guide as a planning layer, not a
        permanent certificate. Use the official MUIS directory for the final current
        check and tell us if a listing looks wrong. A correction is more valuable than
        keeping an old recommendation polished. That evidence-first approach is how a
        near-me guide stays genuinely useful.
    bullets:
      - "Certification, Muslim ownership and self-description use different labels"
      - "Outlet-level checks beat chain-wide assumptions"
      - "Sponsored placement never changes a halal status"
      - "Readers can flag changed hours, status or closure"
    links:
