faq:
  - q: "Where can I buy halal mooncakes in Singapore in 2026?"
    a: >-
      Fairmont Singapore, The Fullerton Hotel, Hotel Indigo Singapore Katong and Yellow
      Ribbon Bakery publish halal-certified baked options for 2026. Verify the exact
      box and flavour in the current MUIS directory before ordering because scope and
      availability can change.
  - q: "Are all Fairmont Singapore mooncakes halal in 2026?"
    a: >-
      Fairmont's official FAQ says all baked mooncakes in its 2026 collection are
      halal-certified. It also says selected snowskin flavours contain alcohol, so do
      not extend the baked-product claim to every snowskin mooncake.
  - q: "Are snowskin mooncakes halal?"
    a: >-
      Some are, but the status is product-specific. Check the exact flavour for alcohol,
      gelatine and certification. Snowskin also needs refrigeration below 5°C because
      it is not heat-treated in the same way as a baked mooncake.
  - q: "When is Mid-Autumn Festival in Singapore in 2026?"
    a: >-
      Mid-Autumn Festival is on 25 September 2026. Many sellers close orders or end
      collection around that date, so order earlier if you need delivery, a preferred
      flavour or multiple corporate gift boxes.
  - q: "How do I check a mooncake's halal certificate?"
    a: >-
      Identify the exact product and production entity, search the official MUIS halal
      directory, and compare the certificate scope with the flavour you are buying.
      Ask the seller for dated confirmation if the product page is ambiguous.
  - q: "How should I store snowskin mooncakes?"
    a: >-
      Keep them refrigerated below 5°C and return them to the fridge promptly after
      serving. Ice-cream mooncakes must remain frozen and should not be refrozen after
      they have thawed.
