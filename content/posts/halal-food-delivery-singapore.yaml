faq:
  - q: "What is the best halal food delivery in Singapore?"
    a: >-
      The best option depends on the job: restaurant delivery for one meal, tingkat for
      recurring weekdays, bento or trays for groups, and certified catering for events.
      Verify the exact kitchen and compare final price, timing and support.
  - q: "Can I trust a delivery app's halal filter?"
    a: >-
      Use it for discovery, then verify the exact outlet or central kitchen in the
      current MUIS directory. App badges and categories can become outdated and do not
      replace official premises-level evidence.
  - q: "Is ordering direct cheaper than a delivery app?"
    a: >-
      Sometimes, but not always. Compare item prices, delivery, platform and small-order
      fees, minimum spend and usable promotions. Direct ordering may have a wider menu;
      apps may offer tracking and centralised support.
  - q: "How early should food arrive for an office lunch?"
    a: >-
      Aim for at least thirty minutes before serving, with extra time for security,
      loading bays and lifts. Name a reachable recipient and provide the company,
      building entrance and reception floor.
  - q: "How do I check a halal tingkat provider?"
    a: >-
      Identify the exact production kitchen, confirm its current MUIS status, and review
      delivery days, menus, portions, skip policy and commitment. Start with a short
      trial when possible.
  - q: "What should I do if delivered food seems unsafe?"
    a: >-
      Do not serve it. Photograph the packaging and condition, contact the seller or
      platform immediately and follow official food-safety guidance. Request the
      appropriate refund or replacement separately from the safety decision.
