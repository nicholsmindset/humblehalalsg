sections:
- h2: Identify the airline operating each flight
  body:
  - Your ticket may carry one airline’s flight number while a partner operates the aircraft. Look at every leg,
    including the return and connecting flight, then check the operating carrier’s current special-meal policy.
    Different airlines and routes may use different kitchens, menus, request deadlines and confirmation processes.
  - A travel agent can help place a request, but you should still review the reservation and contact the operating
    airline if it is not visible. A single successful request on the outbound journey does not establish what will
    be served on a separate return leg.
  image: /blog/crossing-to-johor-bahru-checkpoints-transport.webp
  imageAlt: Illustrative travel essentials including a backpack, passport and map
  caption: AI-generated editorial illustration; not evidence of certification or current conditions.
- h2: Understand what a Muslim meal request means
  body:
  - Many airlines use the meal code MOML for a Muslim meal. Singapore Airlines says its Muslim meals on flights
    departing Singapore are prepared in a halal-certified kitchen using ingredients from halal-certified suppliers.
    That statement is specific to its published description and should not be generalised to every airline or every
    departure airport.
  - Check what the airline says about the meal on your route, not just the code. If you need more information about
    certification, sourcing, other dietary restrictions or a connecting carrier, ask that carrier directly. Keep
    the distinction between a requested special meal, a certified kitchen and an independently verified certificate
    clear.
- h2: Request early and verify the details
  body:
  - Sign in to the airline’s manage-booking page or ask the booking agent to add the special meal. As checked on
    28 October 2026, Singapore Airlines generally requires special meals to be selected at least 24 hours before
    departure, with longer deadlines for flights from certain cities. Check the current rule for your specific flight
    rather than assuming a universal deadline.
  - After requesting, revisit the booking and record the selection for every traveller and segment. A screenshot
    can help you discuss a discrepancy at check-in, but it cannot guarantee what is loaded. Recheck after a flight
    change, cancellation, aircraft change or reissue because requests can need reconfirmation.
- h2: When halal and another dietary need overlap
  body:
  - A Muslim meal is not necessarily vegetarian, dairy-free, gluten-free or free from a specific allergen. Airline
    systems may not offer a single combined meal for every combination. Tell the operating airline about all requirements
    and ask what it can provide on your flight; request written clarification when a serious allergy is involved.
  - Singapore Airlines states that it cannot guarantee special meals are completely free from traces of allergens.
    That is a reminder to make a medical plan with the airline and an appropriate clinician where necessary. Do
    not rely on a halal label to answer an allergy question, and do not assume a vegetarian meal is automatically
    halal.
- h2: What to do on boarding and at meal service
  body:
  - At check-in or boarding, ask staff to confirm that the request appears in the passenger record. When the cabin
    crew serve special meals, identify yourself and check the meal label before opening it. If the meal is missing
    or appears inconsistent with your request, speak with the crew promptly and calmly; they can explain what is
    available on that flight.
  - Do not rely on a crew member to create a meal that was never loaded. If the label does not give enough information,
    ask about the exact item and decide based on the evidence available. A backup snack is useful because onboard
    choice may be limited, especially during disruption.
- h2: Pack a practical backup
  body:
  - 'Choose shelf-stable, sealed items whose exact ingredients and certification you have checked: for example,
    a suitable snack bar, crackers or other packaged food. Pack more than one type if you have a long connection
    or a child travelling with you. Separate snacks needed for allergies and carry any required medication according
    to your travel plan.'
  - Airport security, airline cabin policies and destination biosecurity or customs restrictions can limit liquids
    and certain foods. Check the departure, transit and arrival authorities and your airline for your actual itinerary
    before packing. Do not assume that food permitted on one leg can be carried through the next border.
  image: /blog/halal-snacks-singapore.webp
  imageAlt: A selection of sweet and savoury snack foods
  caption: AI-generated editorial illustration; not evidence of certification or current conditions.
- h2: A sample three-leg itinerary
  body:
  - 'Suppose a family flies Singapore to City A on Airline 1, connects to City B on Airline 2, and returns to Singapore
    on Airline 1. Treat these as three meal checks: confirm the operating carrier, whether food is served, availability
    of the special meal, request deadline and the status for each passenger.'
  - If the connecting flight offers only buy-on-board snacks, review that menu separately and bring a permitted
    alternative. If the family also has a nut allergy, ask each carrier how it handles allergens; the first carrier’s
    policy does not automatically apply to the second. This scenario is illustrative and does not assert any carrier’s
    route-specific service.
- h2: Before you leave home
  body:
  - Open the itinerary and list each operating carrier. Confirm the meal selection for every segment and passenger.
    Check the airline’s current special-meal details and any allergen limitations. Prepare permitted backup food
    and verify transit and destination import rules.
  - At the airport, reconfirm with staff; onboard, check the meal label. If details differ from the booking, ask
    the operating carrier and keep the record for follow-up. This small checklist helps replace guesswork with a
    specific, documented request.
