faq:
- q: Does every flight from Singapore serve a halal-certified meal?
  a: Do not assume so. Check the operating airline, route and exact meal policy for each segment.
- q: What does MOML mean?
  a: Many airlines use MOML for a Muslim meal. The airline’s current description and actual route determine what
    is provided.
- q: Does one meal request cover the whole return itinerary?
  a: Not necessarily. Confirm each traveller and segment, particularly when more than one carrier operates the flights.
- q: Is a Muslim meal automatically vegetarian or allergen-free?
  a: No. Ask the carrier about the combination you need and any limitations.
- q: Can I carry my own food through a connecting airport?
  a: Rules depend on the airport, security, airline and destination. Check each authority before travel.
- q: What if my requested meal is missing?
  a: Tell the cabin crew, ask what alternatives are available, and use any permitted backup food you brought.
