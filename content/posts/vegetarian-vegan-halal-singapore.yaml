faq:
- q: Is all vegetarian food automatically halal?
  a: No. Vegetarian describes an approach to animal ingredients; halal also involves the relevant ingredients and
    preparation.
- q: Is vegan food automatically MUIS-certified?
  a: No. Vegan is not the same claim as MUIS certification. Check the specific product or establishment.
- q: Can a vegetarian item be suitable for a Muslim diner without certification?
  a: An uncertified item is not automatically non-halal, but its ingredients and preparation require individual
    assessment. Choose the evidence standard you need.
- q: Does a halal certificate mean food is nut-free?
  a: No. Ask the supplier about the exact allergen and the preparation environment.
- q: Can I infer a sauce is alcohol-free because the dish is vegetarian?
  a: No. Ask what is used in the actual sauce and whether there is a verified alternative.
- q: What if the staff cannot confirm shared equipment?
  a: Do not guess. Mark the answer as unresolved and choose another option if you need certainty.
