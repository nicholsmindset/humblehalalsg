title: Is vegetarian food halal? What to check when eating in Singapore
status: published
dek: Understand how vegetarian, vegan and halal labels differ, and what to ask about ingredients, shared cooking
  equipment and allergies.
answer: A vegetarian or vegan label tells you something about animal ingredients. It does not, on its own, establish
  halal certification or answer every question about alcohol, processing and shared preparation. Check the exact
  meal or product and decide what evidence you need.
author: The Humble Halal Team
