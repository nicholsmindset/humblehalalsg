name: Flight retry backstop

# Manual recovery backstop for flight bookings stuck in 'confirming'. The paid
# flight product is currently disabled, so this workflow must not consume runner
# time or create alerts on a schedule. Re-enable a schedule only after the travel
# feature is deliberately restored and the production endpoint returns 2xx.
#
# Requires repo secret CRON_SECRET = the value set in Vercel env. lib/cron.ts
# authorizeCron() checks `Authorization: Bearer <CRON_SECRET>`.
# Note: GitHub-scheduled runs can drift a few minutes under load — fine for a backstop.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: flight-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Hit flight-retry cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in this repo."
            exit 1
          fi
          status=$(curl -sS --max-time 60 \
            -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.humblehalal.com/api/cron/flight-retry)
          if [ "$status" = "410" ]; then
            echo "Flight recovery is intentionally unavailable while paid travel is disabled."
            exit 0
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat response.json
            echo "::error::Flight retry endpoint returned HTTP ${status}."
            exit 1
          fi
          cat response.json
